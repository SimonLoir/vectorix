services:
    postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: vectorix
        ports: ['127.0.0.1:5432:5432']
        volumes: ['postgres-data:/var/lib/postgresql']
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d vectorix']
            interval: 5s
            timeout: 5s
            retries: 10
    redis:
        image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
        ports: ['127.0.0.1:6379:6379']
        volumes: ['redis-data:/data']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
    postgres-vector:
        image: ${VECTOR_POSTGRES_IMAGE:-pxdv.be/vectorix/postgres-vector:local}
        build:
            context: .
            dockerfile: infra/postgres-vector/Dockerfile
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${VECTOR_POSTGRES_PASSWORD:-vectorix-local-admin}
            POSTGRES_DB: vectorix_vectors
            VECTOR_PROVISIONER_PASSWORD: ${VECTOR_PROVISIONER_PASSWORD:-vectorix-local-indexer}
            VECTOR_RUNTIME_PASSWORD: ${VECTOR_RUNTIME_PASSWORD:-vectorix-local-runtime}
        ports: ['127.0.0.1:5433:5432']
        volumes: ['vector-data:/var/lib/postgresql']
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -h 127.0.0.1 -U postgres -d vectorix_vectors',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
    rustfs:
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: 0.0.0.0:9000
            RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9001,http://127.0.0.1:9001
            RUSTFS_ACCESS_KEY: ${VECTORIX_DEFAULT_S3_ACCESS_KEY_ID:-vectorix-local}
            RUSTFS_SECRET_KEY: ${VECTORIX_DEFAULT_S3_SECRET_ACCESS_KEY:-vectorix-local-s3-secret}
            RUSTFS_REGION: ${VECTORIX_DEFAULT_S3_REGION:-us-east-1}
            RUSTFS_OBS_LOG_DIRECTORY: /logs
        ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
        volumes: ['rustfs-data:/data', 'rustfs-logs:/logs']
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s
    s3-init:
        image: amazon/aws-cli:2.38.3@sha256:efe32e825cf203652eaca3e7e94679580274e7d567c39270aaa36a5144737108
        depends_on:
            rustfs:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: ${VECTORIX_DEFAULT_S3_ACCESS_KEY_ID:-vectorix-local}
            AWS_SECRET_ACCESS_KEY: ${VECTORIX_DEFAULT_S3_SECRET_ACCESS_KEY:-vectorix-local-s3-secret}
            AWS_DEFAULT_REGION: ${VECTORIX_DEFAULT_S3_REGION:-us-east-1}
            AWS_ENDPOINT_URL: http://rustfs:9000
            AWS_EC2_METADATA_DISABLED: 'true'
            S3_BUCKET: ${VECTORIX_DEFAULT_S3_BUCKET:-vectorix-documents}
        entrypoint: ['/bin/sh', '/scripts/init-bucket.sh']
        volumes: ['./infra/s3:/scripts:ro']
        restart: 'no'
volumes:
    vector-data:
    rustfs-data:
    rustfs-logs:
    postgres-data:
    redis-data:
