name: Docker images

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# Serialize main builds so an older run cannot overwrite a newer latest tag.
concurrency:
    group: docker-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build and test application and vector images
              id: images
              env:
                  KEEP_IMAGES: 'true'
              run: bash scripts/test-docker.sh
            - name: Install pinned Trivy
              if: steps.images.outputs.image_prefix != ''
              uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
              with:
                  version: v0.76.1
            # Report fixed critical/high vulnerabilities in every tested image; non-blocking until triaged.
            - name: Scan tested images
              if: steps.images.outputs.image_prefix != ''
              continue-on-error: true
              env:
                  IMAGE_PREFIX: ${{ steps.images.outputs.image_prefix }}
              run: |
                  status=0
                  for app in web admin api workers migrator postgres-vector; do
                      echo "::group::Trivy $app"
                      trivy image --quiet --severity CRITICAL,HIGH --ignore-unfixed \
                          --exit-code 1 "$IMAGE_PREFIX-$app:test" || status=1
                      echo "::endgroup::"
                  done
                  exit "$status"
            - name: Check registry credentials
              id: registry
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              env:
                  REGISTRY_USERNAME: ${{ secrets.PXDV_REGISTRY_USERNAME }}
                  REGISTRY_PASSWORD: ${{ secrets.PXDV_REGISTRY_PASSWORD }}
              run: |
                  if [[ -n "$REGISTRY_USERNAME" && -n "$REGISTRY_PASSWORD" ]]; then
                      echo 'ready=true' >> "$GITHUB_OUTPUT"
                  else
                      echo 'ready=false' >> "$GITHUB_OUTPUT"
                      echo '::warning::Publication skipped: configure PXDV_REGISTRY_USERNAME and PXDV_REGISTRY_PASSWORD to publish to pxdv.be.'
                  fi
            - name: Log in to pxdv.be
              if: steps.registry.outputs.ready == 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: pxdv.be
                  username: ${{ secrets.PXDV_REGISTRY_USERNAME }}
                  password: ${{ secrets.PXDV_REGISTRY_PASSWORD }}
            - name: Publish tested images
              if: steps.registry.outputs.ready == 'true'
              env:
                  IMAGE_PREFIX: ${{ steps.images.outputs.image_prefix }}
              run: |
                  for app in web admin api workers migrator postgres-vector; do
                      image="pxdv.be/vectorix/$app"
                      docker tag "$IMAGE_PREFIX-$app:test" "$image:sha-$GITHUB_SHA"
                      docker push "$image:sha-$GITHUB_SHA"
                  done
                  main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
                  if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
                      echo '::notice::Commit tags published; latest is reserved for the current main commit.'
                      exit 0
                  fi
                  # Update latest only once all six commit tags are available.
                  for app in web admin api workers migrator postgres-vector; do
                      image="pxdv.be/vectorix/$app"
                      docker tag "$image:sha-$GITHUB_SHA" "$image:latest"
                      docker push "$image:latest"
                  done
            - name: Clean up local images
              if: always() && steps.images.outputs.image_prefix != ''
              env:
                  IMAGE_PREFIX: ${{ steps.images.outputs.image_prefix }}
              run: |
                  for app in web admin api workers migrator postgres-vector; do
                      docker image rm "$IMAGE_PREFIX-$app:test" \
                          "pxdv.be/vectorix/$app:sha-$GITHUB_SHA" \
                          "pxdv.be/vectorix/$app:latest" >/dev/null 2>&1 || true
                  done
