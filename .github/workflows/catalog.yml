name: Catalog checks

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    catalog:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
            - name: Install bounded PDF parser runtime
              run: sudo apt-get update && sudo apt-get install --yes poppler-utils util-linux
            - name: Install pinned package manager and dependencies
              run: |
                  npm install --global pnpm@11.25.0
                  pnpm install --frozen-lockfile
                  pnpm db:generate
            # Visible but non-blocking until advisories are triaged automatically (issues #15 and #47).
            - name: Audit dependencies for high-severity advisories
              continue-on-error: true
              run: pnpm audit --audit-level=high
            - name: Validate schema, contracts, and code
              run: |
                  pnpm --filter @repo/db exec prisma validate
                  pnpm check-types
                  pnpm lint
                  pnpm test
                  pnpm test:documents
                  pnpm test:restore:guards
                  pnpm test:quality:guards
                  pnpm test:capacity:guards
                  pnpm test:interruption:guards
                  pnpm test:s3-outage:guards
            - name: Test Redis authentication with real queues and workers
              run: pnpm test:queues
            - name: Build isolated vector-test image
              run: docker build -f infra/postgres-vector/Dockerfile -t pxdv.be/vectorix/postgres-vector:local .
            - name: Test native vector adapter
              run: |
                  node tests/vector-store/runner.test.mjs
                  pnpm --filter @repo/vector-store test:native
            - name: Test migrations and authorization on isolated databases
              run: pnpm test:catalog
