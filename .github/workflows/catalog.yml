name: Catalog checks

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    catalog:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
            - name: Install pinned package manager and dependencies
              run: |
                  npm install --global pnpm@11.25.0
                  pnpm install --frozen-lockfile
                  pnpm db:generate
            - name: Validate schema, contracts, and code
              run: |
                  pnpm --filter @repo/db exec prisma validate
                  pnpm check-types
                  pnpm lint
                  pnpm test
            - name: Test migrations and authorization on isolated databases
              run: pnpm test:catalog
