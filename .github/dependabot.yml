version: 2
updates:
    # Grouped weekly pull requests; each still runs the catalog and image checks.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          production:
              dependency-type: production
              update-types: [minor, patch]
          development:
              dependency-type: development
              update-types: [minor, patch]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
    - package-ecosystem: docker
      directories:
          - /apps/api
          - /apps/web
          - /apps/admin
          - /apps/workers
          - /packages/db
          - /infra/postgres-vector
      schedule:
          interval: weekly
      ignore:
          - dependency-name: node
            update-types: [version-update:semver-major]
      groups:
          base-images:
              patterns: ['*']
    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
